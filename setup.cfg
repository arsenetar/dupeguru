[metadata]
name = dupeGuru
version = attr: dupeguru.core.__version__
url = https://github.com/arsenetar/dupeguru
project_urls =
    Bug Reports = https://github.com/arsenetar/dupeguru/issues
author = Andrew Senetar
author_email = arsenetar@voltaicideas.net
license = GPL-3.0-only
license_files = LICENSE
description = dupeGuru is a tool to find duplicate files on your computer.
long_description = file:README.md
long_description_content_type = text/markdown
classifiers =
    Development Status :: 5 - Production/Stable
    Intended Audience :: End Users/Desktop
    Operating System :: MacOS :: MacOS X
    Operating System :: Microsoft :: Windows
    Operating System :: POSIX
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3 :: Only
    Topic :: Desktop Environment :: File Managers

[options]
packages =
    dupeguru.core
    dupeguru.core.gui
    dupeguru.core.me
    dupeguru.core.pe
    dupeguru.core.pe.modules
    dupeguru.core.se
    dupeguru.core.tests
    dupeguru.hscommon
    dupeguru.hscommon.gui
    dupeguru.hscommon.jobprogress
    dupeguru.hscommon.tests
    dupeguru.qt
    dupeguru.qt.me
    dupeguru.qt.pe
    dupeguru.qt.pe.modules
    dupeguru.qt.se
python_requires = >=3.7
install_requires =
    Send2Trash>=1.8.2,<3.0.0
    mutagen>=1.46.0,<2.0.0
    distro>=1.8.0,<2.0.0
    PyQt6 >=6.3.0,<7.0; sys_platform != 'linux'
    pywin32>=228; sys_platform == 'win32'
    semantic-version>=2.0.0,<3.0.0
    xxhash>=3.0.0,<4.0.0
setup_requires =
    sphinx>=5.0.0
    polib>=1.1.0
tests_require =
    pytest >=6,<7
include_package_data = true
