name: Build and Release Packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build-release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext python3-venv build-essential
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-extra.txt PyInstaller

      - name: Install dependencies (macOS/Windows)
        if: matrix.os != 'ubuntu-latest'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-extra.txt PyInstaller

      - name: Setup NSIS (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          echo "C:\Program Files (x86)\NSIS" >> $GITHUB_PATH

      - name: Compile resources and modules
        run: |
          python build.py --modules
          python build.py --loc
          python build.py --doc

      - name: Build macOS bundle
        if: matrix.os == 'macos-latest'
        run: |
          python package.py
          cd dist
          zip -r ../dupeguru-mac.zip dupeguru.app

      - name: Build Windows setup installer
        if: matrix.os == 'windows-latest'
        run: |
          python package.py
          mv dist/dupeGuru_*.exe dupeguru-windows-installer.exe

      - name: Build Linux source archive
        if: matrix.os == 'ubuntu-latest'
        run: |
          python package.py --src
          mv build/dupeguru-src-*.tar.xz dupeguru-src.tar.xz

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dupeguru-mac.zip
            dupeguru-windows-installer.exe
            dupeguru-src.tar.xz
          fail_on_unsupported_file: false
