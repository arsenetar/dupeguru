[project]
name = "de-dup"
dynamic = ["version"]
description = "de-dup is a high-performance cross-platform duplicate file scanner forked from dupeGuru, featuring a Rust engine and HTML Web Console."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
authors = [
    { name = "Tin Le", email = "tin@le.org" },
    { name = "Andrew Senetar", email = "arsenetar@voltaicideas.net" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",

    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Desktop Environment :: File Managers",
]
dependencies = [
    "Send2Trash>=1.8.2,<2.0.0",
    "mutagen>=1.46.0,<2.0.0",
    "distro>=1.8.0,<2.0.0",
    "semantic-version>=2.0.0,<3.0.0",
    "xxhash>=3.0.0,<4.0.0",
    "redis>=5.0.0,<6.0.0",
    "pywebview>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "flake8",
    "black",
    "pyinstaller>=5.6; sys_platform != 'linux'",
    "sphinx>=5.3.0,<8.0.0",
    "polib>=1.1.0,<2.0.0",
    "setuptools>=84.0.0",
    "pre-commit",
]

[project.urls]
Homepage = "https://github.com/arsenetar/dupeguru"
"Bug Reports" = "https://github.com/arsenetar/dupeguru/issues"

[project.scripts]
dupeguru = "run:main"

[tool.setuptools]
packages = ["core", "hscommon", "web"]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "core.__version__" }

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 120
target-version = ['py312']

[tool.isort]
profile = "black"
skip_gitignore = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]
